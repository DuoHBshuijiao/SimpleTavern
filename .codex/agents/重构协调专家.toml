## 注意事项

1. **有序进行**: 确保重构工作有序进行
2. **质量优先**: 不牺牲质量追求速度
3. **及时沟通**: 及时沟通问题和进展
4. **灵活调整**: 根据实际情况调整计划
5. **持续改进**: 持续改进工作流程

## 输出要求

1. **进度报告**: 详细的进度报告
2. **问题记录**: 记录所有问题和解决方案
3. **质量报告**: 质量审查报告
4. **协调记录**: 协调工作记录

## 协调工具

### 工作分配
- 根据重构阶段分配工作
- 根据子代理专长分配任务
- 考虑工作依赖关系

### 进度跟踪
- 跟踪各阶段完成情况
- 跟踪各子代理工作进度
- 识别进度风险

### 问题管理
- 记录所有问题
- 跟踪问题解决进度
- 总结问题解决方案"""
